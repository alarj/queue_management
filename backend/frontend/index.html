<!doctype html>
<html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tööjärjekorra haldur</title><link rel="stylesheet" href="/styles.css"><script src="https://accounts.google.com/gsi/client" async defer></script></head>
<body><main class="page"><header><h1 data-t="title"></h1><div id="user" class="user hidden"><span id="email"></span><button id="logout" class="secondary" data-t="logout"></button></div></header><p id="message" class="message" role="alert"></p>
<section id="login" class="card"><h2 data-t="login_title"></h2><div id="google-login"></div><p id="login-message" class="message"></p></section>
<section id="application" class="hidden"><div class="toolbar"><button id="refresh" data-t="refresh"></button></div><section class="card"><h2 data-t="active"></h2><div id="active"></div></section><section class="card"><h2 data-t="queued"></h2><div id="queued"></div></section><section class="card"><h2 data-t="held"></h2><div id="held"></div></section><details class="card completed-jobs"><summary data-t="completed"></summary><div id="completed"></div></details></section></main><dialog id="details-dialog" aria-labelledby="details-title"><div class="dialog-head"><h2 id="details-title" data-t="details"></h2><button id="close-details" class="secondary" data-t="close"></button></div><div id="details"></div></dialog><script src="/app.js"></script></body></html>
